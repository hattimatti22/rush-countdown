<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11100f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rush Countdown">
  <meta name="description" content="Lähtölaskenta Rushin Helsingin konserttiin 10.4.2027.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Rush Countdown – Helsinki 2027</title>
  <style>
    :root { color-scheme: dark; --red:#d83a32; --gold:#e4bd72; --ink:#11100f; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100svh; color:#f6f0e6; background:
        radial-gradient(ellipse at 50% 15%, rgba(166,45,37,.27), transparent 48%),
        linear-gradient(155deg,#211b18 0%,#11100f 54%,#090909 100%);
      font-family: Georgia, "Times New Roman", serif;
      display:flex; align-items:center; justify-content:center;
      padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      overflow-x:hidden;
    }
    .art {
      width:min(100%,560px); position:relative; text-align:center;
      border:1px solid rgba(228,189,114,.5); padding:34px 20px 28px;
      background:linear-gradient(180deg,rgba(20,17,15,.84),rgba(8,8,8,.94));
      box-shadow:0 22px 70px #000a; isolation:isolate;
    }
    .art:before,.art:after { content:""; position:absolute; inset:10px; border:1px solid rgba(216,58,50,.42); pointer-events:none; z-index:-1; }
    .art:after { inset:17px; border-color:rgba(228,189,114,.18); }
    .eyebrow { font:600 11px/1.4 Arial,sans-serif; letter-spacing:.34em; color:var(--gold); text-transform:uppercase; }
    h1 { margin:13px 0 0; color:#f3e8d4; font:900 clamp(46px,13vw,76px)/.95 Arial,sans-serif; letter-spacing:.12em; text-shadow:3px 3px 0 #8e211d, 0 0 24px #b72b2566; }
    .rule { width:76px; height:3px; margin:22px auto; background:var(--red); }
    .tour { font:600 12px/1.6 Arial,sans-serif; letter-spacing:.25em; color:#d9c8aa; }
    .date { margin:8px 0 2px; font-size:clamp(23px,6vw,31px); color:#fff5e6; }
    .venue { font:12px Arial,sans-serif; letter-spacing:.18em; color:#b8a995; text-transform:uppercase; }
    .countdown { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:34px 0 24px; }
    .unit { border-top:1px solid #9e302b; border-bottom:1px solid #9e302b; padding:13px 2px 11px; background:linear-gradient(180deg,#241b19aa,#0b0b0baa); }
    .num { display:block; color:var(--gold); font:700 clamp(27px,8vw,43px)/1.1 Arial,sans-serif; font-variant-numeric:tabular-nums; }
    .label { display:block; margin-top:7px; color:#bdb1a2; font:10px Arial,sans-serif; letter-spacing:.12em; }
    .tagline { color:#d7c6ad; font-size:15px; font-style:italic; margin:18px 0 0; }
    .small { margin-top:24px; color:#776d63; font:10px Arial,sans-serif; letter-spacing:.12em; }
    @media(max-width:360px) { .countdown{gap:4px}.unit{padding:11px 0}.label{font-size:8px} }
  </style>
</head>
<body>
  <main class="art">
    <div class="eyebrow">A night of progressive rock</div>
    <h1>RUSH</h1>
    <div class="rule"></div>
    <div class="tour">HELSINKI · FINLAND</div>
    <div class="date">10. huhtikuuta 2027</div>
    <div class="venue">Konsertti alkaa klo 18.30</div>

    <section class="countdown" aria-label="Aikaa konserttiin">
      <div class="unit"><span class="num" id="days">—</span><span class="label">PÄIVÄÄ</span></div>
      <div class="unit"><span class="num" id="hours">—</span><span class="label">TUNTIA</span></div>
      <div class="unit"><span class="num" id="minutes">—</span><span class="label">MINUUTTIA</span></div>
      <div class="unit"><span class="num" id="seconds">—</span><span class="label">SEKUNTIA</span></div>
    </section>
    <p class="tagline" id="message">The countdown has begun.</p>
    <div class="small">TIME MACHINE · 2027</div>
  </main>
  <script>
    // Helsinki is UTC+3 on 10 April 2027 (daylight saving time).
    const target = new Date("2027-04-10T18:30:00+03:00").getTime();
    const ids = ["days","hours","minutes","seconds"];
    function tick() {
      const remaining = target - Date.now();
      if (remaining <= 0) {
        ids.forEach(id => document.getElementById(id).textContent = "0");
        document.getElementById("message").textContent = "THE SHOW BEGINS!";
        return;
      }
      const values = [
        Math.floor(remaining / 86400000),
        Math.floor((remaining % 86400000) / 3600000),
        Math.floor((remaining % 3600000) / 60000),
        Math.floor((remaining % 60000) / 1000)
      ];
      ids.forEach((id,i) => document.getElementById(id).textContent = values[i]);
    }
    tick();
    setInterval(tick, 1000);
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
    }
  </script>
</body>
</html>
